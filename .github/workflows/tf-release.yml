---
#
# PLEASE NOTE: Managed workflow - do not change manually
#
name: Release

on:
  workflow_dispatch:
    inputs:
      dryRun:
        type: boolean
        description: "Dry-Run"
        default: false

concurrency:
  # only run one release at a time to avoid conflicts
  group: release-${{ github.ref }}

jobs:
  release:
    # Only on main repository (don't release on forks)
    if: github.repository_owner == 'wetransform'

    uses: wetransform/gha-workflows/.github/workflows/mise-release.yml@7f7a6fb739699ce98b9e802074d194058f31fa6b # v4.4.0
    with:
      dry-run: ${{ inputs.dryRun }}
    secrets: inherit
