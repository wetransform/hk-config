---
#
# PLEASE NOTE: Managed workflow - do not change manually
#
name: Release

on:
  workflow_dispatch:
    inputs:
      dryRun:
        type: boolean
        description: "Dry-Run"
        default: false

concurrency:
  # only run one release at a time to avoid conflicts
  group: release-${{ github.ref }}

jobs:
  release:
    # Only on main repository (don't release on forks)
    if: github.repository_owner == 'wetransform'

    uses: wetransform/gha-workflows/.github/workflows/mise-release.yml@efabecf2fba436e990a9f9865ed4532845e1e710 # v4.6.1
    with:
      dry-run: ${{ inputs.dryRun }}
    secrets: inherit
