[tools]
# for git hooks
hk = "2.0.0"
pkl = "0.32.1"
# for scripts/check-evaluator-parity.sh
jq = "1.8.2"

[hooks]
enter = "mise x -- hk install --mise"
postinstall = "mise x -- hk install --mise"

[tasks."test:parity"]
description = "Check that hk's built-in Pkl evaluator and the pkl CLI agree on the configured steps"
run = "./scripts/check-evaluator-parity.sh"

[tasks."ci:check"]
description = "Validate that the distributable Pkl package builds"
run = "rm -rf .out && pkl project package"

[tasks."ci:verify-release"]
description = "Verify the package builds before a release is tagged"
depends = ["ci:check"]

[tasks."ci:set-version"]
description = "Build the distributable Pkl package, stamped with the release version (--version <v>)"
usage = 'flag "--version <version>"'
run = './scripts/ci-set-version.sh --version "{{option(name="version")}}"'

[tasks."ci:publish"]
description = "No-op: the Pkl package is attached to the release at creation time by mise-release (@semantic-release/github assets)"
run = "echo 'ci:publish: nothing to publish (package is attached during release)'"
